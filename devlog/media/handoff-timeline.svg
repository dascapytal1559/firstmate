<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#222">From a worker's "done" to the main reading it</text>
  <text x="24" y="54" fill="#555">Measured before the change (2026-10-29, two finishes): 45 to 48 seconds. After Phase 1: the same event, one wake, a few seconds.</text>

  <text x="24" y="100" font-weight="bold" fill="#222">Before</text>
  <rect x="120" y="84" width="20" height="24" fill="#2b6cb0"/>
  <text x="120" y="126" fill="#444">done written</text>
  <rect x="140" y="84" width="300" height="24" fill="#e2b93b"/>
  <text x="150" y="101" fill="#222">fixed 30 s linger (coalesce the turn-end)</text>
  <rect x="440" y="84" width="60" height="24" fill="#cfd8dc"/>
  <text x="444" y="101" fill="#222" font-size="12">classify</text>
  <rect x="500" y="84" width="230" height="24" fill="#c05621"/>
  <text x="508" y="101" fill="#fff">host engine turn, mean 23 s, always hands back</text>
  <rect x="730" y="84" width="14" height="24" fill="#2f855a"/>
  <text x="750" y="101" fill="#222">main wakes (~45 s)</text>

  <text x="24" y="190" font-weight="bold" fill="#222">After</text>
  <rect x="120" y="174" width="20" height="24" fill="#2b6cb0"/>
  <text x="120" y="216" fill="#444">done written</text>
  <rect x="140" y="174" width="18" height="24" fill="#cfd8dc"/>
  <text x="162" y="191" fill="#222">classify first: captain-relevant, close now</text>
  <rect x="440" y="174" width="14" height="24" fill="#2f855a"/>
  <text x="460" y="191" fill="#222">main wakes (1 to 3 s expected; measured after landing)</text>
  <rect x="140" y="236" width="60" height="18" fill="#e2b93b" opacity="0.7"/>
  <text x="206" y="250" fill="#444" font-size="13">the turn-end that follows is absorbed only on proof: same turn, ended cleanly, nothing new since</text>
  <rect x="140" y="262" width="60" height="18" fill="#c53030" opacity="0.8"/>
  <text x="206" y="276" fill="#444" font-size="13">a run that fails or is interrupted after the done now wakes the main (nothing reported it before)</text>
  <rect x="140" y="288" width="60" height="18" fill="#718096" opacity="0.8"/>
  <text x="206" y="302" fill="#444" font-size="13">cleanup still waits for the worker's turn to end before closing its thread</text>
</svg>
