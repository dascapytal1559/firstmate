<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 430" width="904" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44505c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <rect width="904" height="430" fill="#ffffff"/>

  <text x="20" y="28" font-size="13" font-weight="600" fill="#44505c">WHAT ARRIVES</text>
  <text x="330" y="28" font-size="13" font-weight="600" fill="#44505c">WHO STARTS THE TURN</text>
  <text x="722" y="28" font-size="13" font-weight="600" fill="#44505c">WHERE IT RUNS</text>

  <!-- inputs T3 delivers -->
  <g font-size="13" fill="#1c2630">
    <rect x="20" y="44" width="250" height="40" rx="6" fill="#eef2f6" stroke="#b9c3cd"/>
    <text x="32" y="69">His message, desktop or web</text>
    <rect x="20" y="94" width="250" height="40" rx="6" fill="#eef2f6" stroke="#b9c3cd"/>
    <text x="32" y="119">His message, phone (stock app)</text>
    <rect x="20" y="144" width="250" height="56" rx="6" fill="#eef2f6" stroke="#b9c3cd"/>
    <text x="32" y="167">T3's restart note, a scheduled task,</text>
    <text x="32" y="185">a message sent by a tool</text>
    <!-- the notification -->
    <rect x="20" y="290" width="250" height="56" rx="6" fill="#fdf3e3" stroke="#d9b678"/>
    <text x="32" y="313">A worker notification</text>
    <text x="32" y="331" fill="#6b5a36">(3 of last week's 7 cold reloads)</text>
  </g>
  <text x="32" y="222" font-size="12" fill="#5a6672">(4 of last week's 7 cold reloads)</text>

  <!-- T3 server -->
  <rect x="330" y="44" width="270" height="156" rx="8" fill="#e8f1fb" stroke="#8fb0d6"/>
  <text x="346" y="70" font-size="14" font-weight="600" fill="#1c2630">T3 server</text>
  <text x="346" y="90" font-size="12.5" fill="#34414e">starts every turn it delivers</text>
  <rect x="346" y="106" width="238" height="78" rx="6" fill="#e3f4ea" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="358" y="127" font-size="13" font-weight="600" fill="#17603c">Guard 1, in the T3 fork</text>
  <text x="358" y="147" font-size="12.5" fill="#1c2630">Cache expired on the FirstMate</text>
  <text x="358" y="165" font-size="12.5" fill="#1c2630">thread? Start a new session.</text>

  <!-- stop hook -->
  <rect x="330" y="262" width="270" height="140" rx="8" fill="#fbf1e6" stroke="#d9b678"/>
  <text x="346" y="288" font-size="14" font-weight="600" fill="#1c2630">FirstMate's own stop hook</text>
  <text x="346" y="308" font-size="12.5" fill="#34414e">runs inside the live session</text>
  <rect x="346" y="320" width="238" height="70" rx="6" fill="#e3f4ea" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="358" y="341" font-size="13" font-weight="600" fill="#17603c">Guard 2, in the FirstMate fork</text>
  <text x="358" y="360" font-size="12.5" fill="#1c2630">Idle past the cache lifetime?</text>
  <text x="358" y="378" font-size="12.5" fill="#1c2630">Ring through T3 instead.</text>

  <!-- session -->
  <rect x="722" y="120" width="162" height="190" rx="8" fill="#f3f0fa" stroke="#a99bd0"/>
  <text x="738" y="148" font-size="14" font-weight="600" fill="#1c2630">FirstMate</text>
  <text x="738" y="167" font-size="14" font-weight="600" fill="#1c2630">session</text>
  <text x="738" y="196" font-size="12" fill="#34414e">old: 120k to 750k,</text>
  <text x="738" y="212" font-size="12" fill="#34414e">reloaded in full</text>
  <text x="738" y="240" font-size="12" fill="#17603c">new: about 71k,</text>
  <text x="738" y="256" font-size="12" fill="#17603c">rebuilt from files</text>

  <!-- arrows: inputs to T3 -->
  <g stroke="#44505c" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M270 64 L328 84"/>
    <path d="M270 114 L328 118"/>
    <path d="M270 172 L328 152"/>
    <path d="M270 318 L328 326"/>
    <path d="M600 122 L720 170"/>
    <path d="M600 300 L720 262" stroke-dasharray="5 4"/>
  </g>
  <text x="606" y="110" font-size="11.5" fill="#44505c">new turn</text>
  <text x="604" y="312" font-size="11.5" fill="#8a5a12">wakes the same</text>
  <text x="604" y="326" font-size="11.5" fill="#8a5a12">session directly;</text>
  <text x="604" y="340" font-size="11.5" fill="#8a5a12">T3 sees it only</text>
  <text x="604" y="354" font-size="11.5" fill="#8a5a12">after it has begun</text>

  <!-- guard 2 rings through T3 -->
  <path d="M465 262 L465 204" stroke="#1f7a4d" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
  <text x="474" y="238" font-size="12" fill="#17603c">when cold: one plain message</text>
</svg>
