<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#222">From the last worker's turn ending to "restart now"</text>
  <text x="24" y="54" fill="#555">The hook waits for the fleet to go idle. Before, it only looked on a timer; now the watcher rings it on every worker event.</text>

  <text x="24" y="104" font-weight="bold" fill="#222">Before</text>
  <rect x="120" y="88" width="16" height="24" fill="#2b6cb0"/>
  <text x="104" y="130" fill="#444">turn ends</text>
  <rect x="136" y="88" width="240" height="24" fill="#e2b93b"/>
  <text x="146" y="105" fill="#222">next 30 s poll: quiet #1</text>
  <rect x="376" y="88" width="240" height="24" fill="#f0d27a"/>
  <text x="386" y="105" fill="#222">another 30 s poll: quiet #2</text>
  <rect x="616" y="88" width="14" height="24" fill="#2f855a"/>
  <text x="630" y="130" fill="#222" text-anchor="end">hook fires, 30 to 60 s later</text>

  <text x="24" y="194" font-weight="bold" fill="#222">After</text>
  <rect x="120" y="178" width="16" height="24" fill="#2b6cb0"/>
  <text x="104" y="220" fill="#444">turn ends</text>
  <rect x="136" y="178" width="40" height="24" fill="#cfd8dc"/>
  <rect x="176" y="178" width="18" height="24" fill="#90cdf4"/>
  <rect x="194" y="178" width="14" height="24" fill="#2f855a"/>
  <text x="216" y="195" fill="#222">watcher sees it, rings the hook, the hook re-checks and fires</text>
  <text x="216" y="214" fill="#555" font-size="13">measured 1.1 to 1.8 s after the watcher's scan (five runs); the scan itself comes within 15 s</text>

  <rect x="136" y="250" width="40" height="16" fill="#cfd8dc"/>
  <text x="184" y="263" fill="#444" font-size="13">watcher's next scan: routine turn-ends count too, even the ones it absorbs</text>
  <rect x="136" y="276" width="40" height="16" fill="#e2b93b" opacity="0.6"/>
  <text x="184" y="289" fill="#444" font-size="13">the timer stays as the backstop, for a worker that ends a turn without marking it</text>
</svg>
