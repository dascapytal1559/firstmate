<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A long test run no longer holds a T3 restart</text>
  <text x="24" y="58" font-size="14" fill="#57606a">A staged T3 restart waits for an idle fleet; a worker's own long run used to count as busy for the whole run.</text>

  <g font-size="13" fill="#1f2328">
    <text x="24" y="98" font-weight="600">Before</text>
    <rect x="24" y="108" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="132">worker starts a</text>
    <text x="40" y="152">29-suite test run</text>
    <rect x="270" y="108" width="300" height="70" rx="8" fill="#fff1f0" stroke="#ff8182"/>
    <text x="286" y="132">the run is a child of the worker,</text>
    <text x="286" y="152">so a restart would cut it: fleet busy</text>
    <rect x="616" y="108" width="320" height="70" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="632" y="132">the staged restart waits about</text>
    <text x="632" y="152">50 minutes for the run to end</text>

    <text x="24" y="218" font-weight="600">After</text>
    <rect x="24" y="228" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="252">worker hands the run to</text>
    <text x="40" y="272">fm-job.sh and ends its turn</text>
    <rect x="270" y="228" width="300" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="286" y="252">the run lives outside T3's process tree,</text>
    <text x="286" y="272">so the fleet reads idle: T3 restarts now</text>
    <rect x="616" y="228" width="320" height="70" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="632" y="252">when the run ends, its result reaches</text>
    <text x="632" y="272">the worker's inbox and wakes it</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M224 143 L266 143" marker-end="url(#a)"/>
    <path d="M570 143 L612 143" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <path d="M224 263 L266 263" marker-end="url(#a)"/>
    <path d="M570 263 L612 263" marker-end="url(#a)"/>
  </g>
  <text x="24" y="320" font-size="12" fill="#57606a">Source: bin/fm-job.sh (launcher, records, delivery), bin/fm-fleet-idle.sh (idle exemption), bin/fm-teardown.sh (cleanup).</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
  </defs>
</svg>
