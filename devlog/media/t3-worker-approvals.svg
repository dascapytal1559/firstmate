<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A worker's approval goes to Firstmate, not to the captain</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Before: the worker parked until the captain clicked in T3. After: Firstmate is woken with the command and decides.</text>

  <g font-size="13" fill="#1f2328">
    <rect x="24" y="92" width="190" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="116" font-weight="600">Worker in T3</text>
    <text x="40" y="138">asks to run</text>
    <text x="40" y="158" font-family="Menlo, monospace" font-size="12">python3 - &lt;&lt;EOF</text>
    <text x="40" y="178" fill="#57606a">provider check, full access</text>

    <rect x="270" y="92" width="200" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="286" y="116" font-weight="600">Firstmate's watcher</text>
    <text x="286" y="138">wakes at once with the</text>
    <text x="286" y="158">request id, command,</text>
    <text x="286" y="178">reason, and override</text>

    <rect x="526" y="92" width="210" height="96" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="542" y="116" font-weight="600">Firstmate decides</text>
    <text x="542" y="138">in scope, in its copy: allow</text>
    <text x="542" y="158">out of scope: deny with</text>
    <text x="542" y="178">feedback, steer, interrupt</text>

    <rect x="792" y="92" width="144" height="96" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="808" y="116" font-weight="600">Captain</text>
    <text x="808" y="138">only for a real call,</text>
    <text x="808" y="158">asked by Firstmate</text>
    <text x="808" y="178">as its own decision</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M214 140 L266 140" marker-end="url(#a)"/>
    <path d="M470 140 L522 140" marker-end="url(#a)"/>
    <path d="M736 140 L788 140" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <path d="M631 188 L631 236 L119 236 L119 192" marker-end="url(#a)"/>
  </g>
  <text x="250" y="258" font-size="13" fill="#1f2328">allow or deny lands in the worker's thread, exactly as T3's own buttons would, and is recorded</text>

  <text x="24" y="300" font-size="12" fill="#57606a">Needs the fork's T3 to advertise approval responses; an older T3 falls back to interrupt and steer, still without the captain.</text>
  <text x="24" y="318" font-size="12" fill="#57606a">Source: bin/fm-t3-approve.sh, bin/fm-t3-mcp.mjs, and the stuck-crewmate-recovery skill's T3 permission approvals section.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
  </defs>
</svg>
