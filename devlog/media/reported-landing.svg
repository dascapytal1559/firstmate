<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1f2328">One worker, stage after stage on one branch: which commit lands</text>

  <text x="24" y="89" fill="#57606a">The branch</text>
  <line x1="200" y1="84" x2="560" y2="84" stroke="#d0d7de" stroke-width="3"/>
  <circle cx="200" cy="84" r="12" fill="#8c959f"/>
  <text x="200" y="89" fill="#ffffff" font-size="12" text-anchor="middle">B</text>
  <circle cx="320" cy="84" r="12" fill="#0969da"/>
  <text x="320" y="89" fill="#ffffff" font-size="12" text-anchor="middle">1</text>
  <circle cx="440" cy="84" r="12" fill="#0969da"/>
  <text x="440" y="89" fill="#ffffff" font-size="12" text-anchor="middle">2</text>
  <circle cx="560" cy="84" r="12" fill="#bf8700"/>
  <text x="560" y="89" fill="#ffffff" font-size="12" text-anchor="middle">3</text>
  <text x="320" y="118" fill="#0a3069" font-size="12" text-anchor="middle">reported ready</text>
  <text x="440" y="118" fill="#0a3069" font-size="12" text-anchor="middle">reported ready</text>
  <text x="560" y="118" fill="#7d4e00" font-size="12" text-anchor="middle">in progress</text>

  <text x="24" y="172" fill="#57606a">Before</text>
  <text x="24" y="190" fill="#57606a" font-size="12">one commit recorded</text>
  <text x="24" y="206" fill="#57606a" font-size="12">per task, by looking at</text>
  <text x="24" y="222" fill="#57606a" font-size="12">the worker's copy later</text>
  <rect x="200" y="152" width="230" height="28" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="212" y="171" fill="#116329">stage 1 lands</text>
  <rect x="200" y="188" width="640" height="28" rx="4" fill="#ffebe9" stroke="#ff8182"/>
  <text x="212" y="207" fill="#a40e26">stage 2 refused: the record still names stage 1, so it is reset by hand</text>
  <rect x="200" y="224" width="640" height="28" rx="4" fill="#ffebe9" stroke="#ff8182"/>
  <text x="212" y="243" fill="#a40e26">or no record yet: the worker was still busy when the landing was tried</text>

  <text x="24" y="300" fill="#57606a">Now</text>
  <text x="24" y="318" fill="#57606a" font-size="12">each ready report</text>
  <text x="24" y="334" fill="#57606a" font-size="12">names its commit</text>
  <rect x="200" y="280" width="230" height="28" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="212" y="299" fill="#116329">stage 1 lands on its report</text>
  <rect x="440" y="280" width="400" height="28" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="452" y="299" fill="#116329">stage 2 lands on its report, exactly commit 2</text>
  <rect x="200" y="316" width="640" height="28" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="212" y="335" fill="#7d4e00">commit 3 stays on the branch until a report names it</text>

  <line x1="24" y1="372" x2="856" y2="372" stroke="#d0d7de"/>
  <text x="24" y="402" fill="#1f2328">One real day of 24 stages, replayed: 1 landed without help before, 24 now.</text>
</svg>
