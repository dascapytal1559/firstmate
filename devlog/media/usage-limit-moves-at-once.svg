<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A worker stopped by an account's usage limit</text>
  <text x="24" y="58" font-size="14" fill="#57606a">What happens after a T3 Code worker's run ends on a usage limit, before and after this change.</text>

  <g font-size="13" fill="#1f2328">
    <text x="24" y="98" font-weight="600">Before</text>
    <rect x="24" y="108" width="280" height="90" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="40" y="132">The run ends on the 5-hour limit;</text>
    <text x="40" y="152">about a minute later the watcher</text>
    <text x="40" y="172">says only "this worker went quiet"</text>
    <rect x="330" y="108" width="280" height="90" rx="8" fill="#fff1f0" stroke="#ff8182"/>
    <text x="346" y="132">The background session files it as</text>
    <text x="346" y="152">routine; FirstMate's steer refuses</text>
    <text x="346" y="172">the thread as an exited agent</text>
    <rect x="636" y="108" width="300" height="90" rx="8" fill="#fff1f0" stroke="#ff8182"/>
    <text x="652" y="132">The worker sits stopped until</text>
    <text x="652" y="152">someone notices and works around</text>
    <text x="652" y="172">the steer by hand</text>

    <text x="24" y="238" font-weight="600">After</text>
    <rect x="24" y="248" width="280" height="90" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="40" y="272">The watcher reads why the run failed</text>
    <text x="40" y="292">and tells FirstMate itself: usage</text>
    <text x="40" y="312">limit, which account, when it resets</text>
    <rect x="330" y="248" width="280" height="90" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="346" y="272">FirstMate picks an account with room;</text>
    <text x="346" y="292">the thread is rebound there with the</text>
    <text x="346" y="312">same model and effort, read back</text>
    <rect x="636" y="248" width="300" height="90" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="652" y="272">The ordinary steer continues the work</text>
    <text x="652" y="292">at once; an early reset the captain</text>
    <text x="652" y="312">announces rings every stopped worker</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M304 153 L326 153" marker-end="url(#a)"/>
    <path d="M610 153 L632 153" marker-end="url(#a)"/>
    <path d="M304 293 L326 293" marker-end="url(#a)"/>
    <path d="M610 293 L632 293" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
