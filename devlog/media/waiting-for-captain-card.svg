<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="280" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A worker's card through a captain's decision</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Illustration. The status label is T3's; the words ahead of the title are FirstMate's.</text>

  <g font-size="14" fill="#1f2328">
    <rect x="24" y="84" width="912" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="113" font-weight="600" fill="#0969da">Working</text>
    <text x="160" y="113">Print view for one recipe</text>
    <text x="916" y="113" text-anchor="end" fill="#57606a">the worker runs</text>

    <rect x="24" y="142" width="912" height="48" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="44" y="171" font-weight="600" fill="#57606a">Done</text>
    <text x="160" y="171"><tspan font-weight="600">Waiting for captain</tspan> · Print view for one recipe</text>
    <text x="916" y="171" text-anchor="end" fill="#57606a">FirstMate holds the question for the captain</text>

    <rect x="24" y="200" width="912" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="229" font-weight="600" fill="#0969da">Working</text>
    <text x="160" y="229">Print view for one recipe</text>
    <text x="916" y="229" text-anchor="end" fill="#57606a">the answer ends the wait, and the title comes back</text>
  </g>
</svg>
