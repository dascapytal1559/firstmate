<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A check-in opens with what matters, and ends with what could be picked up</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Illustration with made-up items. The yellow blocks are this fork's; the four sections between them are unchanged.</text>

  <g font-size="14" fill="#1f2328">
    <rect x="24" y="78" width="912" height="154" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="44" y="104" font-weight="600">Priorities</text>
    <text x="44" y="128">Paint the hull</text>
    <text x="44" y="150">Book the pilot before the weekend</text>
    <text x="44" y="180" font-weight="600">High level objectives</text>
    <text x="44" y="204">Tidy harbour: every berth labelled, charts up to date</text>

    <rect x="24" y="244" width="912" height="124" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="270" font-weight="600">Captain's Call</text>
    <text x="220" y="270" fill="#57606a">Nothing needs your action right now.</text>
    <text x="44" y="298" font-weight="600">Recently Landed</text>
    <text x="220" y="298" fill="#57606a">No recent completions are in the current baseline.</text>
    <text x="44" y="326" font-weight="600">Underway</text>
    <text x="220" y="326" fill="#57606a">Nothing is underway.</text>
    <text x="44" y="354" font-weight="600">Charted Next</text>
    <text x="220" y="354" fill="#57606a">Nothing is queued.</text>

    <rect x="24" y="380" width="912" height="92" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="44" y="406" font-weight="600">Ideas (12)</text>
    <text x="44" y="430">A lighthouse tour for visiting crews</text>
    <text x="44" y="454" fill="#57606a">The rest: bin/fm-tasks-axi.sh list --state queued --kind idea</text>
  </g>
</svg>
