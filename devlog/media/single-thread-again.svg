<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2328">Back to one thread</text>
  <text x="24" y="50" fill="#57606a">What waits on the captain is in FirstMate's chat again; a worker's card only says how the worker is doing.</text>

  <text x="24" y="86" font-weight="600" fill="#57606a">Before</text>
  <rect x="24" y="96" width="330" height="210" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="38" y="110" width="302" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="130" fill="#1f2328">FirstMate</text>
  <rect x="58" y="148" width="282" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="166" fill="#1f2328">Print view for one recipe</text>
  <text x="328" y="166" text-anchor="end" fill="#bc4c00">2d</text>
  <rect x="58" y="180" width="282" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="198" fill="#1f2328">Offline maps report</text>
  <text x="328" y="198" text-anchor="end" fill="#0969da">5h</text>
  <rect x="58" y="212" width="282" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="230" fill="#1f2328">Which chart library?</text>
  <text x="328" y="230" text-anchor="end" fill="#57606a">Replied</text>
  <text x="38" y="262" fill="#57606a">Snoozed</text>
  <text x="340" y="262" text-anchor="end" fill="#57606a">2</text>
  <text x="38" y="292" fill="#57606a">Decisions and reports tracked on cards, answered from them.</text>

  <text x="406" y="86" font-weight="600" fill="#57606a">After</text>
  <rect x="406" y="96" width="330" height="210" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="420" y="110" width="302" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="432" y="130" fill="#1f2328">FirstMate</text>
  <rect x="440" y="148" width="282" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="452" y="166" fill="#1f2328">Print view for one recipe</text>
  <text x="710" y="166" text-anchor="end" fill="#57606a">Waiting for captain</text>
  <rect x="440" y="180" width="282" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="452" y="198" fill="#1f2328">Offline maps for saved trails</text>
  <text x="710" y="198" text-anchor="end" fill="#57606a">Testing</text>
  <text x="420" y="240" fill="#1f2328">In FirstMate's chat:</text>
  <text x="420" y="262" fill="#57606a">Captain's Call: Print view, which layout? A or B</text>
  <text x="420" y="292" fill="#57606a">He answers there. Finished workers are cleaned up.</text>
</svg>
