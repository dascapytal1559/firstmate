<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A check-in opens with what the work is for</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Illustration with made-up objectives. The first block is new; the four sections below it are unchanged.</text>

  <g font-size="14" fill="#1f2328">
    <rect x="24" y="78" width="912" height="96" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="44" y="104" font-weight="600">High level objectives</text>
    <text x="44" y="130"><tspan font-weight="600">Tidy harbour:</tspan> every berth labelled, charts up to date</text>
    <text x="44" y="154"><tspan font-weight="600">Calm seas:</tspan> fewer interruptions</text>

    <rect x="24" y="186" width="912" height="124" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="212" font-weight="600">Captain's Call</text>
    <text x="220" y="212" fill="#57606a">Nothing needs your action right now.</text>
    <text x="44" y="240" font-weight="600">Recently Landed</text>
    <text x="220" y="240" fill="#57606a">No recent completions are in the current baseline.</text>
    <text x="44" y="268" font-weight="600">Underway</text>
    <text x="220" y="268" fill="#57606a">Nothing is underway.</text>
    <text x="44" y="296" font-weight="600">Charted Next</text>
    <text x="220" y="296" fill="#57606a">Nothing is queued.</text>
  </g>
</svg>
