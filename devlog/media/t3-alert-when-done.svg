<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">Which FirstMate turns ping</text>
  <text x="24" y="58" font-size="14" fill="#57606a">FirstMate's T3 thread: its automatic turns now end quietly unless the turn has something for the captain.</text>

  <g font-size="13" fill="#1f2328">
    <text x="24" y="98" font-weight="600">Turn starts from</text>
    <text x="616" y="98" font-weight="600">Turn end</text>

    <rect x="24" y="108" width="200" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="141">the captain's message</text>
    <rect x="616" y="108" width="320" height="56" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="632" y="141">ping, as before</text>

    <rect x="24" y="180" width="200" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="204">a notification, ending</text>
    <text x="40" y="222">with a PR, finding or blocker</text>
    <rect x="270" y="180" width="300" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="286" y="204">FirstMate calls t3_thread_update</text>
    <text x="286" y="222">alert_when_done during the turn</text>
    <rect x="616" y="180" width="320" height="56" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="632" y="213">ping</text>

    <rect x="24" y="252" width="200" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="276">a notification, ending</text>
    <text x="40" y="294">"shipshape" or routine</text>
    <rect x="270" y="252" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="286" y="285">no call</text>
    <rect x="616" y="252" width="320" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="632" y="276">quiet (before: a ping on every one</text>
    <text x="632" y="294">of these, most of FirstMate's turns)</text>
  </g>
  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <line x1="224" y1="136" x2="612" y2="136"/>
    <line x1="224" y1="208" x2="266" y2="208"/>
    <line x1="570" y1="208" x2="612" y2="208"/>
    <line x1="224" y1="280" x2="266" y2="280"/>
    <line x1="570" y1="280" x2="612" y2="280"/>
  </g>
</svg>
