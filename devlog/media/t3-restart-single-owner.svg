<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">After a T3 restart: T3 tells, Firstmate reconciles</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Who does what once the server is back, before and after this change.</text>

  <g font-size="13" fill="#1f2328">
    <text x="24" y="98" font-weight="600">Before</text>
    <rect x="24" y="108" width="280" height="90" rx="8" fill="#fff1f0" stroke="#ff8182"/>
    <text x="40" y="132">Firstmate reads the server's process</text>
    <text x="40" y="152">id and start time with lsof and ps</text>
    <text x="40" y="172">(loopback only)</text>
    <rect x="330" y="108" width="280" height="90" rx="8" fill="#fff1f0" stroke="#ff8182"/>
    <text x="346" y="132">Firstmate's own hook refuses the main's</text>
    <text x="346" y="152">first tool call when its lock names a</text>
    <text x="346" y="172">dead process (Claude only)</text>
    <rect x="636" y="108" width="300" height="90" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="652" y="132">every working or waiting worker is</text>
    <text x="652" y="152">steered, even one T3 already resumed</text>
    <text x="652" y="172">that has reported since</text>

    <text x="24" y="238" font-weight="600">After</text>
    <rect x="24" y="248" width="280" height="90" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="40" y="272">T3 reports its own start time</text>
    <text x="40" y="292">(serverStartedAt), remote or local</text>
    <rect x="330" y="248" width="280" height="90" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="346" y="272">T3's note opens whatever reaches the</text>
    <text x="346" y="292">pinned main: run session start again;</text>
    <text x="346" y="312">no Firstmate hook, any agent</text>
    <rect x="636" y="248" width="300" height="90" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="652" y="272">a worker that reported since the restart</text>
    <text x="652" y="292">is left alone; the rest, a busy resumed</text>
    <text x="652" y="312">run included, are steered once</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M304 153 L326 153" marker-end="url(#a)"/>
    <path d="M610 153 L632 153" marker-end="url(#a)"/>
    <path d="M304 293 L326 293" marker-end="url(#a)"/>
    <path d="M610 293 L632 293" marker-end="url(#a)"/>
  </g>
  <text x="24" y="366" font-size="12" fill="#57606a">Source: bin/fm-t3-restart.sh recover, run by session start; T3's restart note and serverStartedAt come from the T3 Code fork.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
