<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#1f2328">A call waiting on other work, raised on day 0, whose blocker clears on day 3</text>
  <text x="24" y="58" font-size="14" fill="#57606a">Illustration. Where its decision thread sits in the Needs me tab, day by day.</text>

  <g font-size="13" fill="#57606a" text-anchor="middle">
    <line x1="200" y1="86" x2="920" y2="86" stroke="#d0d7de"/>
    <line x1="200" y1="80" x2="200" y2="92" stroke="#8c959f"/><text x="200" y="76">day 0: raised</text>
    <line x1="344" y1="80" x2="344" y2="92" stroke="#8c959f"/><text x="344" y="76">day 1</text>
    <line x1="488" y1="80" x2="488" y2="92" stroke="#8c959f"/><text x="488" y="76">day 2</text>
    <line x1="632" y1="80" x2="632" y2="92" stroke="#8c959f"/><text x="632" y="76">day 3: blocker clears</text>
    <line x1="776" y1="80" x2="776" y2="92" stroke="#8c959f"/><text x="776" y="76">day 4</text>
    <line x1="920" y1="80" x2="920" y2="92" stroke="#8c959f"/><text x="900" y="76">day 5</text>
  </g>

  <g font-size="14">
    <text x="24" y="137" font-weight="600" fill="#1f2328">Before</text>
    <rect x="200" y="112" width="432" height="40" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="416" y="137" text-anchor="middle" fill="#0969da">Settled: waits on other work</text>
    <rect x="632" y="112" width="288" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="776" y="137" text-anchor="middle" fill="#57606a">Later, at once: never shown as open</text>

    <text x="24" y="201" font-weight="600" fill="#1f2328">After</text>
    <rect x="200" y="176" width="432" height="40" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="416" y="201" text-anchor="middle" fill="#0969da">Settled: waits on other work</text>
    <rect x="632" y="176" width="144" height="40" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="704" y="201" text-anchor="middle" font-weight="600" fill="#9a6700">Open: needs him</text>
    <rect x="776" y="176" width="144" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="848" y="201" text-anchor="middle" fill="#57606a">Later</text>
  </g>

  <text x="24" y="250" font-size="14" fill="#57606a">The day under FirstMate's card now counts from when the call last became actionable: raised, updated,</text>
  <text x="24" y="272" font-size="14" fill="#57606a">its "remind me later" date arriving, re-asked without that date, or its blocker clearing.</text>
</svg>
